<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 论文阅读管理平台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.card { background:#fff; padding:40px; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.08); width:380px; max-width:90vw; }
.card h1 { font-size:20px; margin-bottom:8px; text-align:center; }
.card .sub { font-size:13px; color:#64748b; text-align:center; margin-bottom:24px; }
.card label { font-size:13px; font-weight:500; display:block; margin-bottom:4px; margin-top:12px; }
.card input { width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; outline:none; }
.card input:focus { border-color:#2563eb; }
.card .btn { width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; margin-top:20px; }
.card .btn:hover { background:#1d4ed8; }
.card .link { text-align:center; margin-top:14px; font-size:13px; }
.card .link a { color:#2563eb; text-decoration:none; }
.card .error { color:#ef4444; font-size:12px; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>论文阅读管理平台</h1>
  <p class="sub">登录你的账号</p>
  <label>用户名</label>
  <input type="text" id="username" placeholder="请输入用户名" autofocus>
  <label>密码</label>
  <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">登 录</button>
  <div class="error" id="error"></div>
  <div class="link">没有账号？<a href="/register">立即注册</a></div>
</div>
<script>
async function login() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value.trim();
  if (!u || !p) { document.getElementById('error').textContent = '请填写用户名和密码'; return; }
  var res = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  });
  var data = await res.json();
  if (data.ok) { window.location.href = '/'; }
  else { document.getElementById('error').textContent = data.error || '登录失败'; }
}
</script>
</body>
</html>
